# Window rules — appid/title are regexes
# Small utility windows float and centre
window_rule=is_floating:1,width:900,height:600,app_id:^org\.pulseaudio\.pavucontrol$
window_rule=is_floating:1,width:900,height:600,app_id:^(pavucontrol|blueman-manager|nm-connection-editor)$
window_rule=is_floating:1,width:1000,height:700,app_id:^org\.kde\.(polkit-kde-authentication-agent-1|kwalletd6|ark|gwenview|okular)$
window_rule=is_floating:1,title:^(Picture-in-Picture|Picture in picture)$
window_rule=is_floating:1,width:700,height:500,title:^(Open File|Save As|Choose.*|File Upload)$

# Steam: main window tiles, popups/friends float
window_rule=is_floating:1,width:380,height:720,app_id:^steam$,title:^Friends List$
window_rule=is_floating:1,width:900,height:650,app_id:^steam$,title:^(Steam Settings|Special Offers|Screenshot Uploader)$

# No window may ever swallow its parent terminal (applies to the NEW window, so it also covers terminals opened earlier)
window_rule=no_swallow:1,app_id:.*

# Terminals do NOT swallow windows (so GUI apps launched from a terminal never hide its logs).
# To enable swallowing again: windowrule=isterm:1,appid:^(kitty|foot)$  (and noswallow:1 for apps like discord)

# Games: tearing allowed, no dimming of unfocused fullscreen, opaque
window_rule=force_tearing:1,app_id:^steam_app_.*$
window_rule=unfocused_opacity:1.0,app_id:^steam_app_.*$
window_rule=unfocused_opacity:1.0,app_id:^(mpv|vlc)$

# Noctalia panels: zoom animation
layer_rule=animation_type_open:zoom,layer_name:^noctalia.*
layer_rule=animation_type_close:zoom,layer_name:^noctalia.*

# Floating, centred terminal (Super+Enter opens kitty with this class)
window_rule=is_floating:1,width:1400,height:850,app_id:^kitty-float$
