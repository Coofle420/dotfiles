--ozone-platform-hint=auto
--force-dark-mode
# One --enable-features only (later ones override earlier ones):
#  - WebUIDarkMode: dark internal pages
#  - WebContentsForceDark: auto-darken light websites (selective = leaves photos alone). Delete this item to turn it off.
--enable-features=WebUIDarkMode,WebContentsForceDark:inversion_method/cielab_based/image_behavior/selective
# Purple theme + start page / scrollbars extension
--load-extension=/home/tree/.config/helium-theme,/home/tree/.config/helium-ext
