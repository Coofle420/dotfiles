# Binds — SUPER-centric; Noctalia owns launcher/control-center/lock/media
# Key Bindings (Super-centric)
# Apps / shell
bind=SUPER,Return,spawn,kitty --class kitty-float
bind=SUPER+CTRL,Return,spawn,kitty
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,e,spawn,dolphin
bind=SUPER,b,spawn,helium-browser
bind=SUPER,l,spawn,noctalia msg session lock
bind=SUPER+SHIFT,e,spawn,noctalia msg panel-toggle session
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=SHIFT,Print,spawn,noctalia msg screenshot-fullscreen

# Steam
bind=SUPER+SHIFT,k,spawn,steam

# Basecamp (Helium web app)
bind=SUPER+SHIFT,b,spawn,/opt/helium-browser-bin/helium-wrapper --profile-directory=Default --app-id=nbcopffeanpomgfeccnbakllkmjlknkn

# Websites (open in Helium)
bind=SUPER,r,spawn,helium-browser https://www.reddit.com
bind=SUPER,t,spawn,helium-browser https://www.twitch.tv
bind=SUPER,y,spawn,helium-browser https://www.youtube.com
bind=SUPER,x,spawn,helium-browser https://x.com

# Session / config
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,q,quit

# Windows
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER+CTRL,f,togglefakefullscreen,
bind=SUPER+SHIFT,f,spawn,kitty --class kitty-float -e yazi
bind=SUPER+SHIFT,t,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER,n,switch_layout
bind=SUPER,Tab,focusstack,next
bind=ALT,Tab,togglejump,

# Focus (arrows + vim keys)
bind=SUPER,bracketleft,resizewin,-50,+0
bind=SUPER,bracketright,resizewin,+50,+0
bind=SUPER+CTRL,bracketleft,resizewin,+0,-50
bind=SUPER+CTRL,bracketright,resizewin,+0,+50
bind=SUPER,h,resizewin,-50,+0
bind=SUPER,j,resizewin,+0,+50
bind=SUPER,k,resizewin,+0,-50
bind=SUPER,semicolon,resizewin,+50,+0

# Move windows
bind=SUPER+SHIFT,Left,focusdir,left
bind=SUPER+SHIFT,Right,focusdir,right
bind=SUPER+SHIFT,Up,focusdir,up
bind=SUPER+SHIFT,Down,focusdir,down
bind=SUPER+SHIFT,h,focusdir,left
bind=SUPER+SHIFT,j,focusdir,down
bind=SUPER+SHIFT,semicolon,focusdir,right
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,semicolon,exchange_client,right

# Resize / nudge floating
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+ALT,Up,movewin,+0,-50
bind=SUPER+ALT,Down,movewin,+0,+50
bind=SUPER+ALT,Left,movewin,-50,+0
bind=SUPER+ALT,Right,movewin,+50,+0

# Scroller layout
bind=SUPER+ALT,bracketleft,set_proportion,0.5
bind=SUPER+ALT,bracketright,switch_proportion_preset,
bind=SUPER,equal,set_proportion,1.0
bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction

# Workspaces (tags)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=CTRL+ALT,Left,viewtoleft,0
bind=CTRL+ALT,Right,viewtoright,0
bind=CTRL+ALT+SHIFT,Left,tagtoleft,0
bind=CTRL+ALT+SHIFT,Right,tagtoright,0

# Monitors
bind=SUPER+CTRL+SHIFT,Left,focusmon,left
bind=SUPER+CTRL+SHIFT,Right,focusmon,right
bind=SUPER+ALT+SHIFT,Left,tagmon,left
bind=SUPER+ALT+SHIFT,Right,tagmon,right

# Gaps
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,g,togglegaps

# Media / hardware keys
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
