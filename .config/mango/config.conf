# ─── Mango main config ───────────────────────────────────────────
# Modular: edit the files below. Reload: SUPER+SHIFT+R

# AUTOSTART
exec_once=noctalia
exec_once=/home/tree/.config/mango/portals.sh
exec_once=/usr/lib/polkit-kde-authentication-agent-1

# Monitor Rules Layout
monitor_rule=name:DP-2,width:2560,height:1440,refresh:200,x:0,y:0,scale:1,vrr:1,primary:1
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:144,x:2560,y:0,scale:1,vrr:0

source=~/.config/mango/visuals.conf
source=~/.config/mango/layouts.conf
source=~/.config/mango/input.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/binds.conf
# Catppuccin palette (generated by Noctalia — do not edit)

exec_once=/home/tree/.local/bin/wavv-listener-start

# Noctalia palette (generated from ~/.config/noctalia/templates/mango.conf)
source_optional=~/.config/mango/noctalia.conf
