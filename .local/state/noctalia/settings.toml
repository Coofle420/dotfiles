config_version = 14

[bar.default]
center = [ "audio_visualizer" ]
end = [ "tray", "notifications", "volume", "clock", "control-center", "session", "wallhaven", "wallpaper" ]
start = [ "btn", "workspaces" ]

[dock]
background_opacity = 0.0
enabled = false
pinned = [
    "helium",
    "org.kde.dolphin",
    "discord",
    "chrome-nbcopffeanpomgfeccnbakllkmjlknkn-Default",
    "me.proton.Pass",
    "proton.vpn.app.gtk",
    "com.adamcake.Bolt",
    "audacity",
    "cider",
    "fluxer",
    "me.proton.Mail",
    "md.obsidian.Obsidian",
    "steam",
    "kitty",
    "com.obsproject.Studio"
]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "ezequiel/mango_layouts", "noctalia/wallhaven" ]

[shell]
avatar_path = "/home/tree/Pictures/Avatar/thumb-350-375207.jpg"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    pinned = [
        "kitty.desktop",
        "helium.desktop",
        "steam.desktop",
        "org.kde.dolphin.desktop",
        "com.obsproject.Studio.desktop",
        "com.obsproject.Studio",
        "steam",
        "helium",
        "cider",
        "signal",
        "filmcraft",
        "photocraft"
    ]

[theme]
builtin = "Catppuccin"
custom_palette = "DarkPurple"
mode = "dark"
source = "custom"

    [theme.templates]
    community_ids = [ "spicetify", "discord", "steam" ]

[wallpaper]
directory = "/home/tree/Pictures/Wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/tree/Pictures/Wallpapers/voyager-5.jpg"

    [wallpaper.last]
    path = "/home/tree/Pictures/Wallpapers/voyager-5.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/tree/Pictures/Wallpapers/voyager-5.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/tree/Pictures/Wallpapers/voyager-5.jpg"

[widget.btn]
type = "ezequiel/mango_layouts:btn"

[widget.tray]
drawer = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"